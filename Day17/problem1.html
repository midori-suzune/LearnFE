<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Document</title>
    <style>
        .modal{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            display: flex;
            justify-content: center;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s linear;
        }
        .modal.is-show{
            opacity: 1;
            visibility: visible;
        }
        .modal-content{
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            width: 400px;
            margin: auto;
            position: relative;
        }
        .modal-close{
            position: absolute;
            top: 0;
            right: 0;
            width: 30px;
            height: 30px;
            display: flex;
            background-color: #eee;
            align-items: center;
            justify-content: center;
        }
        .modal-desc{
            margin-bottom: 20px;      
            padding: 20px;  
        }
        .modal-action{
            display: flex;
            justify-content: space-around;
        }
        .modal-submit{
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
        }
        .modal-cancel{
            background-color: #6c757d;
            color: #fff;                
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
