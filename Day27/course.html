<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="course.js" defer></script>
    <style>
        .form-post {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            font-size: 18px;
            margin-bottom: 10px;
            margin-right: 10px;
        }

        input {
            padding: 10px;
            font-size: 16px;
            width: 300px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            position: relative;
            top: 0;
            left: 30px;
            background-color: #a768e2;
            color: white;
            border: none;
            border-radius: 5px;
        }
        .form-group #bestSeller {
            width: 20px;
            height: 20px;   
        }
    </style>
</head>

<body>
    <form class="form-post" method="get">
            <div class="form-group">
                <label>Title</label>
                <input type="text" name="title" id="title">
            </div>
            <div class="form-group">
                <label>Image</label>
                <input type="text" name="image" id="image">
            </div>
            <div class="form-group">
                <label>Price</label>
                <input type="number" name="price" id="price">
            </div>
            <div class="form-group">
                <label>Best Seller</label>
                <input type="checkbox" name="bestSeller" id="bestSeller">
            </div>
            <div class="form-group">
                <label>Buy Amount</label>
                <input type="number" name="buyAmount" id="buyAmount">
            </div>
            <div class="form-group">
                <label>Rating</label>
                <input type="number" name="rating" id="rating">
            </div>
            <div class="form-group">
                <label>Author</label>
                <input type="text" name="author" id="author">
            </div>
            <div class="form-group">
                <button type="submit">Add Course</button>
            </div>
        </div>
    </form>
</body>

</html>
