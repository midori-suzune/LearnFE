<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .content {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }

        h1 {
            text-align: center;
        }

        .student-form {
            margin-bottom: 20px;
        }

        .input {
            margin-bottom: 12px;
        }

        label {
            display: inline-block;
            width: 110px;
        }

        input {
            width: 260px;
            padding: 8px;
        }

        .submit-user {
            width: 90px;
            padding: 9px;
            margin-left: 114px;
            color: white;
            font-weight: bold;
            background-color: #23b14d;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 10px;
            border: 1px solid #333;
            text-align: left;
        }

        th:first-child,
        td:first-child {
            width: 50px;
            text-align: center;
        }

        .action {
            display: flex;
            gap: 8px;
        }

        .action button {
            min-width: 70px;
            padding: 6px 10px;
            cursor: pointer;
        }
    </style>
    <script src="crud.js" defer></script>
</head>

<body>
    <div class="content">
        <h1>Student Management</h1>

        <form class="student-form">
            <div class="input">
                <label for="lastName">Last Name:</label>
                <input id="lastName" type="text" name="lastName">
            </div>
            <div class="input">
                <label for="firstName">First Name:</label>
                <input id="firstName" type="text" name="firstName">
            </div>
            <div class="input">
                <label for="studentCode">Student Code:</label>
                <input id="studentCode" type="text" name="studentCode">
            </div>
            <button type="submit" class="submit-user">+Add</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Last Name</th>
                    <th>First Name</th>
                    <th>Student Code</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody class="student-list"></tbody>
        </table>
    </div>
</body>

</html>
