<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            width: 100%;
            height: 100vh;
        }

        .submit {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .submit.inactive{
            display: none;        
        }
        .submit button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .submit button:hover {
            background-color: #0056b3;
        }

        .account {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50%;
            width: 80%;
            border: 1px solid black;
            background-color: white;
            margin: 0 auto;
            border-radius: 5px;

        }
        .cover {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            transform: translateY(-2px);            
        }
        .cover.active{
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 300px;
        }

        .login-facebook button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #3b5998;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .login-facebook button:hover {
            background-color: #2d4373;
        }

        .account label {
            font-size: 14px;
            color: #333;
        }

        .account input {
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .login-account button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #0d110e;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .login-account button:hover {
            background-color: #218838;
        }
    </style>
</head>

<body>
    <div class="submit">
        <button type="submit" class="button">Submit a photo</button>
    </div>
    <div class="cover">
        <div class="content">
            <div class="main-content">
                <div class="logo">
                    <h1>Login</h1>
                </div>
                <div class="login-facebook">
                    <button type="submit">Login with Facebook</button>
                </div>
                <div class="account">
                    <label>Email</label>
                    <input type="email" id="username" name="username">
                    <label>Password</label>
                    <input type="password" id="password" name="password">
                    <div class="login-account">
                        <button type="submit">Login</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="problem2.js"></script>
</body>

</html>
