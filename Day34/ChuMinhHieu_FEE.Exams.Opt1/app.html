<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .content{
            width: 100%;
            height: 100%;            
        }
        .content .content-submit .title{
            text-align: center;            
        }
        .content .content-submit .input{
            margin-bottom: 20px;
            border-radius: 3px;
        }
        .content .content-submit label {
            margin-right: 10px;            
        }
        .content .content-submit .submit-user{
            padding: 10px;
            width: 80px;
            text-align: center;
            background-color: rgb(20, 235, 20);
            color: white;
            font-weight: bold;
            border: 1px solid white;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        table , td , th {
            border: 1px solid black;
            
        }
        th , td {
            padding: 10px;
            width: 100px;   
        }
        .action {
            display: flex;
            flex-direction: column;
        }
        .action button {
            width: 70px;            
        }
       
    </style>
</head>
<body>
    <div class="content">
        <div class="content-submit">
            <div class="title">
                <h1>Student Management</h1>
            </div>
            <form class="add-user">
                <div class="input">
                    <label for="">Last Name: </label>
                    <input type="text" name="lastname">
                </div>
                <div class="input">
                    <label for="">First Name: </label>
                    <input type="text" name="first-name">
                </div>
                <div class="input">
                    <label for="">Code Name: </label>
                    <input type="text" name="code-name">
                </div>
                <button type="submit" class="submit-user"> +Add</button>
            </form>
        </div>
        <div class="content-show">
            <table class="show-data">
                <tr>
                    <th>#</th>
                    <th>Last Name</th>
                    <th>First Name</th>
                    <th>Student Code</th>
                    <th> </th>
                </tr>     
                <tbody class="show-data-body">                  
         
                </tbody>                
            </table>
        </div>
    </div>
</body>
    <script src="app.js"></script>
</html>
